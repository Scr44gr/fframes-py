[package]
name = "fframes-py"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
description = "Typed Python bindings for fframes animation and video rendering"
license = "MIT"
include = [
    "/rust/**", "/src/**", "/tests/**", "/examples/**", "/scripts/**", "/docs/**", "/licenses/**",
    "/Cargo.lock", "/pyproject.toml", "/uv.lock", "/rust-toolchain.toml", "/.python-version", "/README.md", "/LICENSE",
]

[lib]
name = "_native"
path = "rust/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
fframes = { version = "=1.2.0", features = ["exif"] }
pyo3 = { version = "0.29.3", features = ["abi3-py311"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
subtp = "0.2.0"

[target.'cfg(not(windows))'.dependencies]
fframes = { version = "=1.2.0", features = ["build-portable"] }
# Upstream's `h264` feature selects GPL libx264. Use OpenH264 instead.
ffmpeg-sys-fframes = { version = "=9.0.0", features = ["build-lib-openh264"] }

[target.'cfg(target_os = "macos")'.dependencies]
fframes_skia_renderer = { version = "=1.2.0", features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
fframes_skia_renderer = { version = "=1.2.0", features = ["vulkan"] }

[profile.release]
lto = "thin"
codegen-units = 1

# Keep source locations without exceeding MSVC's PDB limit with Skia/FFmpeg.
[profile.dev]
debug = "line-tables-only"

[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
redundant_clone = "warn"
needless_collect = "warn"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
