name: Native dependencies
description: Install the native dependencies required by fframes 1.2
runs:
  using: composite
  steps:
    - if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y clang libclang-dev nasm pkg-config
    - if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install llvm nasm pkg-config
        echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
    - if: runner.os == 'Windows'
      shell: pwsh
      run: ./scripts/setup-native.ps1
