name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: &platforms [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - uses: ./.github/actions/native
      - name: Install toolchain and development tools
        shell: bash
        run: |
          rustup show
          uv sync --locked --no-install-project
          echo "PYO3_PYTHON=$(uv python find)" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2.9.2
      - name: Rust checks
        shell: bash
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          if [ "$RUNNER_OS" = Linux ]; then
            python_lib=$(uv run --no-sync python -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')
            export LD_LIBRARY_PATH="$python_lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          fi
          cargo test --locked
      - name: Build one stable-ABI wheel per platform
        shell: bash
        run: uv build --no-sources --wheel --out-dir dist
      - name: Build source distribution
        if: runner.os == 'Linux'
        run: uv build --no-sources --sdist --out-dir dist
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  test:
    name: Test / ${{ matrix.os }} / Python ${{ matrix.python }}
    needs: build
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        os: *platforms
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - uses: actions/download-artifact@v8.0.1
        with:
          name: wheels-${{ matrix.os }}
          path: dist
      - name: Install built wheel
        shell: bash
        run: |
          uv sync --locked --no-install-project
          uv pip install --no-deps dist/*.whl
      - name: Python quality checks
        if: runner.os == 'Linux' && matrix.python == '3.14'
        shell: bash
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
          uv run --no-sync mypy
      - name: Test installed wheel
        run: uv run --no-sync pytest
      - name: Upload coverage to Codecov
        if: runner.os == 'Linux' && matrix.python == '3.14'
        uses: codecov/codecov-action@v7.1.1
        with:
          files: coverage.xml
          disable_search: true
          use_oidc: true
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python }}
          path: coverage.xml
          if-no-files-found: error
